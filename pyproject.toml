[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "news-intelligence"
version = "0.1.0"
description = "Self-hosted news analysis platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "httpx>=0.27",
    "feedparser>=6.0",
    "newspaper4k[lxml]>=0.9",
    "apscheduler==3.10.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "vaderSentiment>=3.3",
    "langid>=1.1.6",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "nltk>=3.8",
]

[project.optional-dependencies]
# Heavy ML deps — NOT required to run the core pipeline on a Raspberry Pi.
# Install via `pip install ".[ner]"` (or the `vps` Docker target).
ner = [
    "gliner2-onnx>=0.1",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
]
# Vector embeddings (Phase 4, optional). Requires a pgvector-enabled Postgres.
embeddings = [
    "pgvector>=0.3",
]
# Server-side PDF export of articles / stories (Phase 4, optional, vps only).
pdf = [
    "reportlab>=4.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
