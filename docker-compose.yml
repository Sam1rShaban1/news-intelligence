services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_intelligence
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      target: vps
    command: ["-m", "src.workers"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      NEWS_SENTIMENT_MODEL: transformer
      NEWS_LOG_LEVEL: INFO
    volumes:
      - ./config:/app/config:ro
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import psycopg2; psycopg2.connect('postgresql://news:news@postgres:5432/news_intelligence')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  ner:
    build:
      target: vps
    command: ["-m", "src.workers.ner_service"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      NEWS_LOG_LEVEL: INFO
      OMP_NUM_THREADS: "2"
      ORT_NUM_THREADS: "2"
      NEWS_NER_POLL_INTERVAL: "2"
      NEWS_NER_BATCH_SIZE: "50"
    volumes:
      - ./config:/app/config:ro
      - hf_cache:/root/.cache/huggingface
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import psycopg2; psycopg2.connect('postgresql://news:news@postgres:5432/news_intelligence')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    build:
      target: vps
    command: ["-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
    restart: "no"

  seed:
    build:
      target: vps
    command: ["scripts/seed_sources.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      PYTHONPATH: /app
    volumes:
      - ./config:/app/config:ro
    restart: "no"

  alerts:
    build:
      target: vps
    command: ["-m", "src.workers.alerts_service"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      NEWS_LOG_LEVEL: INFO
    volumes:
      - ./config:/app/config:ro
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import psycopg2; psycopg2.connect('postgresql://news:news@postgres:5432/news_intelligence')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  embeddings:
    build:
      target: vps
    command: ["-m", "src.workers.embeddings_service"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      NEWS_LOG_LEVEL: INFO
    volumes:
      - ./config:/app/config:ro
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import psycopg2; psycopg2.connect('postgresql://news:news@postgres:5432/news_intelligence')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      target: vps
    command: ["-m", "src.api.main"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      NEWS_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    depends_on:
      - web
    ports:
      - "8501:80"
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  hf_cache:
