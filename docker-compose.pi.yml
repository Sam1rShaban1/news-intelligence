# Raspberry Pi deployment (4B / 8GB, no GPU).
#
# Builds the lightweight `pi` Docker target: the heavy ONNX / pgvector stack is
# NOT installed, and NER + embeddings are disabled via the FEATURE_* flags. The
# pipeline still runs fetch -> extract -> sentiment (VADER + mk/sq/tr lexicon),
# de-duplication, merge, and the full web UI + API.
#
#   docker compose -f docker-compose.pi.yml build --target pi
#   docker compose -f docker-compose.pi.yml up -d
#
# Use the default `docker-compose.yml` (target `vps`) on a VPS for full features
# (multilingual GLiNER2 NER, baked sentiment transformer, vector embeddings).

services:
  postgres:
    # Plain Postgres on the Pi (pgvector image has no arm64 build; embeddings are off).
    image: postgres:16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_intelligence
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      target: pi
    command: ["-m", "src.workers"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      # Lightweight sentiment only (VADER + mk/sq/tr lexicon).
      NEWS_SENTIMENT_MODEL: auto
      NEWS_FEATURE_NER: "false"
      NEWS_FEATURE_EMBEDDINGS: "false"
      NEWS_LOG_LEVEL: INFO
    volumes:
      - ./config:/app/config:ro
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import psycopg2; psycopg2.connect('postgresql://news:news@postgres:5432/news_intelligence')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    build:
      target: pi
    command: ["-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
    restart: "no"

  seed:
    build:
      target: pi
    command: ["scripts/seed_sources.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      PYTHONPATH: /app
    volumes:
      - ./config:/app/config:ro
    restart: "no"

  web:
    build:
      target: pi
    command: ["-m", "src.api.main"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEWS_DATABASE_URL: postgresql://news:news@postgres:5432/news_intelligence
      NEWS_FEATURE_NER: "false"
      NEWS_FEATURE_EMBEDDINGS: "false"
      NEWS_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    depends_on:
      - web
    ports:
      - "8501:80"
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
