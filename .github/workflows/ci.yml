name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
          POSTGRES_DB: news_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEWS_DATABASE_URL: postgresql://news:news@localhost:5432/news_intelligence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (from pinned lockfiles)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.lock
          pip install pytest pytest-cov ruff mypy pip-audit
      - name: Lint (ruff)
        run: ruff check src/ config/ tests/ scripts/
      - name: Type check (mypy, advisory)
        # Advisory for now: surfaces type issues without blocking the pipeline.
        continue-on-error: true
        run: mypy src/
      - name: Alembic migrate
        run: python -m alembic upgrade head
      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing
      - name: Dependency audit (pip-audit, advisory)
        # Advisory: reports known CVEs in pinned deps without failing the build.
        continue-on-error: true
        run: pip-audit -r requirements/base.lock -r requirements/vps.lock

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build vps tier (includes verified model bake)
        run: docker compose build web
      - name: Build pi tier
        run: docker compose build --target pi
