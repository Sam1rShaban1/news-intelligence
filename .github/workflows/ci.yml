name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
          POSTGRES_DB: news_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEWS_DATABASE_URL: postgresql://news:news@localhost:5432/news_intelligence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (from pinned lockfiles)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.lock
          pip install pytest pytest-cov ruff mypy pip-audit
      - name: Lint (ruff)
        run: ruff check src/ config/ tests/ scripts/
      - name: Type check (mypy, advisory)
        # Advisory on purpose: the SQLAlchemy code has many mypy-stub false
        # positives (e.g. "FromClause has no attribute 'delete'") that are not
        # real bugs. This still surfaces genuinely new type issues in diffs.
        continue-on-error: true
        run: mypy src/
      - name: Alembic migrate
        run: python -m alembic upgrade head
      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing
      - name: Dependency audit (pip-audit, blocking)
        # Fails the build on ANY known vulnerability in the pinned dependency
        # tree. Keep deps patched; use --ignore-vuln <ID> only for documented,
        # accepted risks.
        run: pip-audit -r requirements/base.lock -r requirements/vps.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install (allowlist esbuild build via ui/.npmrc)
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build vps tier (includes verified model bake)
        run: docker compose build web
      - name: Build pi tier
        run: docker compose build --target pi
