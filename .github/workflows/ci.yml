name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
          POSTGRES_DB: news_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEWS_DATABASE_URL: postgresql://news:news@localhost:5432/news_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # The app runs as `python -m src.workers` (PYTHONPATH=/app), not as an
        # installed package, so we install runtime + dev deps directly.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install \
            "sqlalchemy[asyncio]>=2.0" \
            "psycopg2-binary>=2.9" \
            "alembic>=1.13" \
            "httpx>=0.27" \
            "feedparser>=6.0" \
            "newspaper4k[lxml]>=0.9" \
            "apscheduler==3.10.4" \
            "fastapi>=0.115" \
            "uvicorn[standard]>=0.30" \
            "pydantic-settings>=2.0" \
            "vaderSentiment>=3.3" \
            "langid>=1.1.6" \
            "beautifulsoup4>=4.12" \
            "pyyaml>=6.0"
      - name: Lint (ruff)
        run: ruff check src/ config/ tests/ scripts/
      - name: Alembic migrate
        run: python -m alembic upgrade head
      - name: Tests
        run: pytest -q
