name: Bug report
description: Report a problem with News Intelligence
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please fill in as much as you can — it helps us
        reproduce and fix quickly.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Start the stack with `docker compose up -d`
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Deployment details
      placeholder: |
        - Deployment: docker compose / bare metal / other
        - OS + arch:
        - News Intelligence version/commit:
        - Postgres / pgvector version:
        - Browser (if UI-related):
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste relevant logs (`docker compose logs <service>`).
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
