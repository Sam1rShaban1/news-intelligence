server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI backend service (same compose network).
    # `web` is resolved at request time via Docker's embedded DNS (127.0.0.11),
    # so nginx starts even if `web` is not yet up. The variable upstream must be
    # set BEFORE the rewrite so it is not skipped by `break`.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://web:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
